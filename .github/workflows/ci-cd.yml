# Deliberately small CI (type check, lint, a handful of unit tests) and CD to the demo VM.
# The full unit and e2e suites stay local (build-verifier, pnpm test:e2e); see deploy/DEPLOY_INFRA.md.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # paths-filter lists a PR's files through the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.23.0'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'source/backend/**'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'source/frontend/**'
              - '.github/workflows/ci-cd.yml'
            terraform:
              - 'deploy/terraform/**'
            app:
              - 'source/backend/**'
              - 'source/frontend/**'
              - 'deploy/compose.yaml'
              - 'deploy/Caddyfile'
              - 'deploy/scripts/deploy-release.sh'
              - 'deploy/scale-out/**'
              - '.github/workflows/ci-cd.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm lint
      # Smoke set only: config validation, login, PDF browser launch.
      - run: >-
          pnpm exec vitest run
          src/shared/config/env.validation.spec.ts
          src/features/auth/auth.service.spec.ts
          src/features/publication/pdf/pdf-renderer.service.spec.ts

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # tsc -b + vite build
      - run: pnpm lint
      - run: pnpm exec vitest run src/features/auth/pages/LoginPage.test.tsx

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/terraform/oci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # Static checks only: apply runs on the operator's machine, so no OCI credential lives on GitHub.
      - run: terraform fmt -check -recursive
      # Providers come from GitHub Releases (oracle/oci); a release-download outage on 2026-11-08 (504) failed
      # this job and therefore blocked deploy. Cache them per lock file and retry init.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('deploy/terraform/oci/.terraform.lock.hcl') }}
      - name: terraform init (cached providers, 3 attempts)
        env:
          TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for attempt in 1 2 3; do
            terraform init -backend=false -input=false && exit 0
            echo "init failed (attempt $attempt), retrying in 30 s"; sleep 30
          done
          exit 1
      - run: terraform validate

  deploy:
    # Not gated on the terraform job: deploy ships the app and never runs terraform, so a provider-download
    # outage (2026-11-08) must not block it. A terraform failure still turns the run red.
    needs: [changes, backend, frontend]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true')
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure SSH
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEMO_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEMO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Ship release
        env:
          HOST: ${{ secrets.DEMO_SSH_HOST }}
        run: |
          git archive --format=tar.gz "$GITHUB_SHA" | ssh -o ServerAliveInterval=30 "ubuntu@$HOST" "
            set -e
            d=/srv/ctdt/releases/$GITHUB_SHA
            rm -rf \"\$d.tmp\" && mkdir -p \"\$d.tmp\"
            tar -xz -C \"\$d.tmp\"
            chmod +x \"\$d.tmp\"/deploy/scripts/*.sh
            rm -rf \"\$d\" && mv \"\$d.tmp\" \"\$d\""
      - name: Prebuild on pool VMs (old containers keep serving)
        env:
          HOST: ${{ secrets.DEMO_SSH_HOST }}
        run: bash deploy/scale-out/ci-pool.sh build "$HOST" "$GITHUB_SHA"
      - name: Build, migrate, switch (rolls back on failed health)
        env:
          HOST: ${{ secrets.DEMO_SSH_HOST }}
        run: ssh -o ServerAliveInterval=30 "ubuntu@$HOST" "/srv/ctdt/releases/$GITHUB_SHA/deploy/scripts/deploy-release.sh"
      - name: Switch pool VMs to the same release
        env:
          HOST: ${{ secrets.DEMO_SSH_HOST }}
        run: bash deploy/scale-out/ci-pool.sh switch "$HOST" "$GITHUB_SHA"
