# Development services only. The application itself runs on the host (`pnpm dev`).
name: ctdt
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctdt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctdt}
      POSTGRES_DB: ${POSTGRES_DB:-ctdt_real}
      # Vietnamese ordering comes from ICU; the backend refuses to start without it.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=vi-VN --locale=C.UTF-8
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    # BullMQ needs keys never evicted; AOF keeps queued jobs across a restart.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # F-22 only: a synthetic stand-in for the school's SQL Server. Opt-in (pnpm school-db:sim:start); never real data.
  school-db-sim:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ['school-db-sim']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SCHOOL_DB_SIM_SA_PASSWORD:?set SCHOOL_DB_SIM_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: '1536'
    mem_limit: 2g
    # Loopback only: the simulator is reachable from this machine and nowhere else.
    ports:
      - '127.0.0.1:${SCHOOL_DB_SIM_PORT:-14330}:1433'

volumes:
  postgres-data:
  redis-data:
